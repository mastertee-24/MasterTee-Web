<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="required">
        <label for="text">FullName:</label>
        <input type="name" name="FullName" required>
        <br>
        <label for="email">Email:</label>
        <input type="email"  name="email" id="Email" required>
        <br>
         <label for="email">Password:</label>
        <input type="password"  name="password" id="Password" required>
        <br>
         <label for="email">Dob:</label>
        <input type="date"  name="Dob" id="Dob">
        <br>
        <label>Service:</label>
        <select name="" id="">
            <option value="">Select Service:</option>
            <option value="">Screen Replacement</option>
             <option value="">Motherboard Repair</option>
              <option value="">Downboard Repair</option>
               <option value="">Phone Flashing</option>

        </select>
        <br>
        <label for="text">Department:<font color="red">*</font></label>
        <select name="" id="">
            <option value="">Select Department:</option>
            <option value="">Mass Communication</option>
             <option value="">Law</option>
              <option value="">Performing Art</option>
               <option value="">Biology Education</option>
                <option value="">English Education</option>
                 <option value="">Computer Science</option>
                  <option value="">Agricultural Sciences</option>
        </select>
        <br>
        <label for="text">Address:</label>
        <textarea name="address" id="address">
            Address:

        </textarea>
        <br>
        <label for="text">Male:</label>
        <input type="radio" name="gendeer" id="Male">
        <br>
        <label for="text">Female:</label>
        <input type="radio" name="gender" id="Female">
        <br>
        <label for="text">upload passport:</label>
        <input type="file" name="passport">
        <br>
        <input type="submit" name="submit">&nbsp;
        <input type="reset" name="reset">
    </form>
</body>
</html>
